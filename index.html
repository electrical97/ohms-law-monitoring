<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ohm's Law Monitoring System</title>
</head>

<body>

    <h1>Ohm's Law Monitoring System</h1>

    <h2>Live Monitoring</h2>

    <div>
        <h3>Voltage</h3>
        <p id="voltage">0 V</p>
    </div>

    <div>
        <h3>Current</h3>
        <p id="current">0 A</p>
    </div>

    <div>
        <h3>Resistance</h3>
        <p id="resistance">0 Ω</p>
    </div>

    <div>
        <h3>Power</h3>
        <p id="power">0 W</p>
    </div>

    <h2>Ohm's Law Calculation</h2>

    <table border="1">
        <tr>
            <th>Parameter</th>
            <th>Formula</th>
            <th>Result</th>
        </tr>

        <tr>
            <td>Voltage</td>
            <td>V = I × R</td>
            <td id="tableVoltage">0 V</td>
        </tr>

        <tr>
            <td>Current</td>
            <td>I = V / R</td>
            <td id="tableCurrent">0 A</td>
        </tr>

        <tr>
            <td>Resistance</td>
            <td>R = V / I</td>
            <td id="tableResistance">0 Ω</td>
        </tr>

        <tr>
            <td>Power</td>
            <td>P = V × I</td>
            <td id="tablePower">0 W</td>
        </tr>
    </table>

    <h2>Hence, Ohm's Law is Proved.</h2>

    <footer>
        <p>Ohm's Law Monitoring System</p>
    </footer>

</body>
</html>
